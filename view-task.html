<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Kanban</title>
    <!-- CDN de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex flex-col bg-purple-50 min-h-screen font-sans text-slate-800">

    <header class="bg-violet-800 text-slate-100 p-6 shadow-md mb-8">
        <h1 class="text-3xl font-extrabold text-center uppercase tracking-tight"><a href="./index.html" class="text-slate-100 hover:text-slate-300">Gestor de Proyectos Scrum</a></h1>
    </header>

    <main class="grow container mx-auto px-4 pb-12">
        <div class="max-w-5xl mx-auto space-y-6">
            
            <!-- NAV-BAR INTERNA: Cambios rápidos -->
            <nav class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
                <div class="flex flex-col md:flex-row md:items-center md:flex-wrap w-full gap-4">
                    <!-- Cambio de Estado -->
                    <div class="flex-1 lg:flex-none flex items-center gap-2">
                        <label class="text-xs font-bold text-slate-500 uppercase w-20 md:w-auto">Estado:</label>
                        <select id="change-status" class="flex-1 lg:flex-none p-2 border rounded-lg bg-slate-50 text-sm outline-none focus:ring-2 focus:ring-violet-400">
                            <option value="porHacer">Por hacer</option>
                            <option value="enCurso">En curso</option>
                            <option value="hecho">Hecho</option>
                        </select>
                    </div>

                    <!-- Cambio de Prioridad -->
                    <div class="flex-1 lg:flex-none flex items-center gap-2">
                        <label class="text-xs font-bold text-slate-500 uppercase w-20 md:w-auto">Prioridad:</label>
                        <select id="change-priority" class="flex-1 lg:flex-none p-2 border rounded-lg bg-slate-50 text-sm outline-none focus:ring-2 focus:ring-violet-400">
                            <option value="baja">Baja</option>
                            <option value="media">Media</option>
                            <option value="alta">Alta</option>
                        </select>
                    </div>
                </div>

                <!-- Enlaces de navegación -->
                <div class="flex flex-col md:flex-row md:items-center gap-4 border-t pt-4 md:border-t-0 md:border-l-0 md:pt-0 lg:border-l lg:pl-4 lg:border-t-0 border-slate-200 w-full lg:w-auto">
                    <button id="btn-delete" class="w-full md:w-auto border border-red-600 text-red-600 hover:bg-red-50 px-3 py-2 rounded-lg font-medium transition flex items-center justify-center md:justify-start gap-1 whitespace-nowrap">
                        <span>🗑️</span> Eliminar tarea
                    </button>
                    <a id="btn-edit" href="" class="w-full md:w-auto border border-violet-600 text-violet-600 hover:bg-violet-50 px-3 py-2 rounded-lg font-medium transition flex items-center justify-center md:justify-start gap-1 whitespace-nowrap">
                        <span>✏️</span> Editar tarea
                    </a>
                    <a href="./index.html" class="w-full md:w-auto text-slate-800 hover:text-slate-600 font-medium flex items-center justify-center md:justify-start whitespace-nowrap md:ms-auto">
                        &larr; Volver al tablero
                    </a>
                </div>
            </nav>

            <!-- SECCIÓN DE DETALLES -->
            <section class="bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden">
                <!-- Cabecera del detalle -->
                <div class="bg-violet-100 p-6 border-b border-slate-200">
                    <div class="flex items-center gap-3 mb-2">
                        <span id="view-priority-badge" class="px-2 py-1 rounded text-xs font-bold uppercase">

                        </span>
                        <span id="view-status-badge" class="px-2 py-1 rounded text-xs font-bold uppercase">

                        </span>
                    </div>
                    <h2 id="view-title" class="text-3xl font-bold text-slate-800"></h2>
                </div>

                <!-- Cuerpo del detalle -->
                <div class="p-8 space-y-8">
                    <!-- Descripción -->
                    <div>
                        <h4 class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-3">Descripción</h4>
                        <p id="view-description" class="text-slate-700 leading-relaxed text-lg">
                        </p>
                    </div>

                    <!-- Grid de Metadatos -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 pt-6 border-t border-slate-100">
                        <div class="flex items-center gap-4">
                            <div class="bg-violet-100 p-3 rounded-full text-violet-600 text-xl">🕒</div>
                            <div>
                                <p class="text-xs font-bold text-slate-400 uppercase">Creado el</p>
                                <p id="view-created-at" class="font-semibold text-slate-700"></p>
                            </div>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="bg-violet-100 p-3 rounded-full text-violet-600 text-xl">📅</div>
                            <div>
                                <p class="text-xs font-bold text-slate-400 uppercase">Fecha de Vencimiento</p>
                                <p id="view-due-date" class="font-semibold text-slate-700"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <footer class="text-center py-8 text-slate-500 text-sm border-t border-slate-200 mt-auto">
        <p>&copy; 2026 Aplicación web de gestión de tareas | Práctica DAW06</p>
    </footer>

    <!-- Enlace relativo a JS -->
    <script type="module" src="./js/view-task.js"></script>
</body>
</html>
