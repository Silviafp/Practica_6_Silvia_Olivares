<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Kanban</title>
    <!-- CDN de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Animación para details -->
    <link rel="stylesheet" href="./css/details-animation.css">
</head>
<body class="flex flex-col bg-purple-50 min-h-screen font-sans text-slate-800">

    <header class="bg-violet-800 text-slate-100 p-6 shadow-md mb-8">
        <h1 class="text-3xl font-extrabold text-center uppercase tracking-tight"><a href="./index.html" class="text-slate-100 hover:text-slate-300">Gestor de Proyectos Scrum</a></h1>
    </header>

    <main class="grow container mx-auto px-4 pb-12">
        
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            
            <!-- Zona de crear tarea y filtros -->
            <aside class="lg:col-span-1 space-y-6">
                <section class="flex bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <a href="./form-task.html" class="w-full bg-violet-800 text-slate-100 py-2 px-4 rounded-lg font-semibold hover:bg-violet-600 transition-colors shadow-sm text-center">Crear Tarea</a>
                </section>

                <section id="filtros" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h2 class="flex items-center text-xl font-bold mb-4 text-slate-700 border-b pb-2">Búsqueda y Filtros <span id="filter-count" class="bg-slate-300 text-slate-600 text-xs py-1 px-2 rounded-full ml-auto"></span></h2>
                    <input id="filter-name" name="filter-name" type="text" placeholder="Buscar por nombre..." class="w-full p-3 border rounded-lg mb-4 outline-none focus:ring-2 focus:ring-violet-400">
                    <div class="mb-4">
                        <label class="block text-sm font-semibold text-slate-600 mb-1">Estado</label>
                        <select id="filter-status" name="filter-status" class="w-full p-3 border rounded-lg outline-none bg-white focus:ring-2 focus:ring-violet-400">
                            <option value="all">Todos los estados</option>
                            <option value="porHacer">Por hacer</option>
                            <option value="enCurso">En curso</option>
                            <option value="hecho">Hecho</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-600 mb-1">Prioridad</label>
                        <select id="filter-priority" name="filter-priority" class="w-full p-3 border rounded-lg outline-none bg-white focus:ring-2 focus:ring-violet-400">
                            <option value="all">Todas las prioridades</option>
                            <option value="alta">Prioridad Alta</option>
                            <option value="media">Prioridad Media</option>
                            <option value="baja">Prioridad Baja</option>
                        </select>
                    </div>
                </section>
            </aside>

            <!-- Zona de Kanban -->
            <section id="kanban" class="lg:col-span-3 grid grid-cols-1 lg:grid-cols-3 gap-4">
                <!-- Columna Por hacer -->
                <!-- Versión Desktop (md+) -->
                <div class="hidden md:block bg-slate-200/50 p-4 rounded-xl min-h-[500px] border-t-4 border-neutral-400">
                    <h3 class="font-bold text-slate-600 uppercase mb-4 flex items-center justify-between">
                        Por hacer <span id="todo-count-dsk" class="bg-slate-300 text-slate-600 text-xs py-1 px-2 rounded-full"></span>
                    </h3>
                    <div id="todoDsk" class="space-y-3">
                    </div>
                </div>
                
                <!-- Columna En curso -->
                <!-- Versión Desktop (md+) -->
                <div class="hidden md:block bg-slate-200/50 p-4 rounded-xl min-h-[500px] border-t-4 border-orange-400">
                    <h3 class="font-bold text-slate-600 uppercase mb-4 flex items-center justify-between">
                        En curso <span id="inprogress-count-dsk" class="bg-slate-300 text-slate-600 text-xs py-1 px-2 rounded-full"></span>
                    </h3>
                    <div id="inprogressDsk" class="space-y-3">
                    </div>
                </div>
                
                <!-- Columna Hecho -->
                <!-- Versión Desktop (md+) -->
                <div class="hidden md:block bg-slate-200/50 p-4 rounded-xl min-h-[500px] border-t-4 border-emerald-400">
                    <h3 class="font-bold text-slate-600 uppercase mb-4 flex items-center justify-between">
                        Hecho <span id="done-count-dsk" class="bg-slate-300 text-slate-600 text-xs py-1 px-2 rounded-full"></span>
                    </h3>
                    <div id="doneDsk" class="space-y-3">
                    </div>
                </div>

                <!-- Versión Móvil (< md) -->
                <details open class="md:hidden bg-slate-200/50 p-4 rounded-xl border-t-4 border-neutral-400">
                    <summary class="font-bold text-slate-600 uppercase mb-4 flex items-center justify-between cursor-pointer hover:text-slate-700 select-none">
                        Por hacer <span id="todo-count-mob" class="bg-slate-300 text-slate-600 text-xs py-1 px-2 rounded-full"></span>
                    </summary>
                    <div id="todoMob" class="space-y-3 pt-2">
                    </div>
                </details>

                <!-- Versión Móvil (< md) -->
                <details open class="md:hidden bg-slate-200/50 p-4 rounded-xl border-t-4 border-orange-400">
                    <summary class="font-bold text-slate-600 uppercase mb-4 flex items-center justify-between cursor-pointer hover:text-slate-700 select-none">
                        En curso <span id="inprogress-count-mob" class="bg-slate-300 text-slate-600 text-xs py-1 px-2 rounded-full"></span>
                    </summary>
                    <div id="inprogressMob" class="space-y-3 pt-2">
                    </div>
                </details>
                
                <!-- Versión Móvil (< md) -->
                <details open class="md:hidden bg-slate-200/50 p-4 rounded-xl border-t-4 border-emerald-400">
                    <summary class="font-bold text-slate-600 uppercase mb-4 flex items-center justify-between cursor-pointer hover:text-slate-700 select-none">
                        Hecho <span id="done-count-mob" class="bg-slate-300 text-slate-600 text-xs py-1 px-2 rounded-full"></span>
                    </summary>
                    <div id="doneMob" class="space-y-3 pt-2">
                       
                    </div>
                </details>
            </section>
        </div>

    </main>

    <footer class="text-center py-8 text-slate-500 text-sm border-t border-slate-200 mt-auto">
        <p>&copy; 2026 Aplicación web de gestión de tareas | Práctica DAW06</p>
    </footer>

    <!-- Enlace relativo a JS -->
    <script type="module" src="./js/index.js"></script>
</body>
</html>
